<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      * {
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 0;
        margin: 0;
        background: #f5f7fa;
      }
      
      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
      }
      
      .header h2 {
        margin: 0;
        font-size: 20px;
      }
      
      .container {
        padding: 20px;
        max-width: 500px;
        margin: 0 auto;
      }
      
      .field {
        margin-bottom: 15px;
      }
      
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 5px;
        color: #333;
        font-weight: 600;
      }
      
      input, select {
        width: 100%;
        padding: 10px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s;
      }
      
      input:focus, select:focus {
        outline: none;
        border-color: #667eea;
      }
      
      .owner-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      
      .owner-row select {
        flex: 1;
      }
      
      .btn-add {
        width: 40px;
        height: 40px;
        padding: 0;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 0.3s;
      }
      
      .btn-add:hover {
        background: #5568d3;
      }
      
      .submit-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        margin-top: 10px;
        transition: transform 0.2s;
      }
      
      .submit-btn:hover {
        transform: translateY(-2px);
      }
      
      .submit-btn:active {
        transform: translateY(0);
      }
      
      .status {
        margin-top: 15px;
        padding: 10px;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        display: none;
      }
      
      .status.success {
        background: #d4edda;
        color: #155724;
        display: block;
      }
      
      .status.error {
        background: #f8d7da;
        color: #721c24;
        display: block;
      }
      
      .hint {
        font-size: 11px;
        color: #888;
        margin-top: 4px;
      }
      
      .required {
        color: #ea4335;
      }
    </style>
  </head>

  <body>

    <div class="header">
      <h2>➕ Новый вебинар</h2>
    </div>

    <div class="container">

      <div class="field">
        <label>Название <span class="required">*</span></label>
        <input type="text" id="title" placeholder="Введите название вебинара">
      </div>

      <div class="field">
        <label>Дата <span class="required">*</span></label>
        <input type="date" id="date">
      </div>

      <div class="field">
        <label>Время</label>
        <input type="time" id="time">
      </div>

      <div class="field">
        <label>Ответственный <span class="required">*</span></label>
        <div class="owner-row">
          <select id="owner">
            <option value="">— Загрузка... —</option>
          </select>
          <button class="btn-add" onclick="addNewOwner()" title="Добавить нового">+</button>
        </div>
        <div class="hint">Если нет в списке, нажмите +</div>
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="email@example.com">
      </div>

      <div class="field">
        <label>Город</label>
        <input type="text" id="city" placeholder="Город проведения">
      </div>

      <div class="field">
        <label>Ссылка</label>
        <input type="text" id="link" placeholder="https://...">
      </div>

      <div class="field">
        <label>Комментарий</label>
        <input type="text" id="comment" placeholder="Дополнительная информация">
      </div>

      <button class="submit-btn" onclick="createWebinar()">Создать вебинар</button>

      <div class="status" id="status"></div>

    </div>

    <script>
      window.onload = function() {
        loadOwners();
      };

      function loadOwners() {
        google.script.run
          .withSuccessHandler(function(owners) {
            const select = document.getElementById('owner');
            select.innerHTML = '';
            
            if (!owners || owners.length === 0) {
              select.innerHTML = '<option value="">— Список пуст —</option>';
              return;
            }
            
            const emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = '— Выберите —';
            select.appendChild(emptyOpt);
            
            owners.forEach(function(owner) {
              const opt = document.createElement('option');
              opt.value = owner.name;
              opt.textContent = owner.name + (owner.position ? ' (' + owner.position + ')' : '');
              opt.dataset.email = owner.email || '';
              select.appendChild(opt);
            });
          })
          .withFailureHandler(function(err) {
            document.getElementById('owner').innerHTML = '<option value="">— Ошибка —</option>';
          })
          .getResponsiblesList();
      }

      document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('owner').addEventListener('change', function() {
          const selected = this.options[this.selectedIndex];
          const email = selected.dataset.email;
          if (email) {
            document.getElementById('email').value = email;
          }
        });
      });

      function addNewOwner() {
        const name = prompt('Введите имя нового ответственного:');
        if (!name || !name.trim()) return;
        
        const email = prompt('Введите email:');
        if (!email || !email.trim()) {
          alert('Email обязателен!');
          return;
        }
        
        const position = prompt('Введите должность (необязательно):') || '';
        const phone = prompt('Введите телефон (необязательно):') || '';
        
        google.script.run
          .withSuccessHandler(function() {
            loadOwners();
            setTimeout(function() {
              const select = document.getElementById('owner');
              for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].value === name.trim()) {
                  select.selectedIndex = i;
                  select.dispatchEvent(new Event('change'));
                  break;
                }
              }
            }, 500);
          })
          .withFailureHandler(function(err) {
            alert('Ошибка: ' + err.message);
          })
          .addResponsibleFromDialog(name.trim(), email.trim(), position.trim(), phone.trim());
      }

      function createWebinar() {
        const data = {
          title: document.getElementById("title").value.trim(),
          date: document.getElementById("date").value,
          time: document.getElementById("time").value,
          owner: document.getElementById("owner").value,
          email: document.getElementById("email").value.trim(),
          city: document.getElementById("city").value.trim(),
          link: document.getElementById("link").value.trim(),
          comment: document.getElementById("comment").value.trim()
        };

        if (!data.title) {
          showStatus(' Укажите название', 'error');
          return;
        }
        if (!data.date) {
          showStatus('❌ Укажите дату', 'error');
          return;
        }
        if (!data.owner) {
          showStatus('❌ Выберите ответственного', 'error');
          return;
        }

        showStatus('⏳ Создаём...', 'success');

        google.script.run
          .withSuccessHandler(function() {
            showStatus('✅ Вебинар создан!', 'success');
            setTimeout(function() { google.script.host.close(); }, 1000);
          })
          .withFailureHandler(function(err) {
            showStatus('❌ Ошибка: ' + err.message, 'error');
          })
          .createWebinar(data);
      }

      function showStatus(message, type) {
        const status = document.getElementById('status');
        status.innerText = message;
        status.className = 'status ' + type;
      }
    </script>

  </body>
</html>
